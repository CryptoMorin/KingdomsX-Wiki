name: ci

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache
          restore-keys: |
            mkdocs-material-

      - run: pip install mkdocs-material pymdown-extensions

      - name: Clone Wiki
        run: |
          git clone "https://github.com/CryptoMorin/KingdomsX.wiki.git" wiki

      - name: Populate docs folder
        run: |
          # Don't override existing files
          # rm -rf docs
          # mkdir docs

          # Copy all wiki pages
          find wiki -maxdepth 1 -name "*.md" -exec cp {} docs/ \;

          # GitHub Wiki home page -> MkDocs index
          if [ -f docs/Home.md ]; then
            mv docs/Home.md docs/index.md
          fi

      - name: Convert GitHub alerts to MkDocs admonitions
        run: |
          python << 'PY'
          from pathlib import Path
          import re
      
          ALERT_MAP = {
              "NOTE": "note",
              "TIP": "tip",
              "IMPORTANT": "info",
              "WARNING": "warning",
              "CAUTION": "danger",
          }
      
          for md_file in Path("docs").rglob("*.md"):
              text = md_file.read_text(encoding="utf-8")
      
              lines = text.splitlines()
              out = []
      
              i = 0
              while i < len(lines):
                  line = lines[i]
      
                  m = re.match(r'^>\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*$', line)
      
                  if m:
                      kind = ALERT_MAP[m.group(1)]
      
                      out.append(f"!!! {kind}")
                      out.append("")
      
                      i += 1
      
                      while i < len(lines):
                          block_line = lines[i]
      
                          if not block_line.startswith(">"):
                              break
      
                          content = block_line[1:]
                          if content.startswith(" "):
                              content = content[1:]
      
                          out.append(f"    {content}")
                          i += 1
      
                      out.append("")
                      continue
      
                  out.append(line)
                  i += 1
      
              md_file.write_text("\n".join(out) + "\n", encoding="utf-8")
      
          PY

      - name: Convert GitHub line breaks
        run: |
          python << 'PY'
          from pathlib import Path
          import re

          for md_file in Path("docs").rglob("*.md"):
              text = md_file.read_text(encoding="utf-8")

              # Replace a backslash at end-of-line with <br>
              text = re.sub(r'\\\r?\n', '<br>\n', text)

              md_file.write_text(text, encoding="utf-8")
          PY

      - run: mkdocs gh-deploy --force
