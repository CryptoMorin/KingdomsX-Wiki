name: ci

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache
          restore-keys: |
            mkdocs-material-

      - run: pip install mkdocs-material

      - name: Clone Wiki
        run: |
          git clone "https://github.com/CryptoMorin/KingdomsX.wiki.git" wiki

      - name: Populate docs folder
        run: |
          rm -rf docs
          mkdir docs

          # Copy all wiki pages
          find wiki -maxdepth 1 -name "*.md" -exec cp {} docs/ \;

          # GitHub Wiki home page -> MkDocs index
          if [ -f docs/Home.md ]; then
            mv docs/Home.md docs/index.md
          fi

      - run: mkdocs gh-deploy --force
