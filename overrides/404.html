<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Kingdom Not Found | KingdomsX</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=UnifrakturCook:wght@700&display=swap');

        :root {
            --gold: #d4af37;
            --dark: #0a0a0a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            background: #0a0a0a;
            color: #ddd;
            font-family: 'Cinzel', serif;
            height: 100vh;
            position: relative;
        }

        #background {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(rgba(10,10,10,0.85), rgba(10,10,10,0.92)),
                        url('https://images.unsplash.com/photo-1616594039960-4f0a5a7c4c3e?q=80&w=2070') center/cover;
            filter: contrast(1.1) brightness(0.7);
            z-index: -3;
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2;
            pointer-events: none;
        }

        .fog {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), 
                        rgba(212, 175, 55, 0.09) 0%, transparent 65%);
            z-index: -1;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .kingdom-logo {
            font-family: 'UnifrakturCook', cursive;
            font-size: 5.8rem;
            color: var(--gold);
            text-shadow: 0 0 25px rgba(212, 175, 55, 0.9);
            margin-bottom: 0.5rem;
        }

        .error-code {
            font-size: 9.5rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 0 40px var(--gold), 4px 4px 0 #000, -4px -4px 0 #000;
            line-height: 0.85;
        }

        .subtitle {
            font-size: 1.9rem;
            color: #aaa;
            letter-spacing: 4px;
            margin-bottom: 2rem;
        }

        .message {
            font-size: 1.4rem;
            max-width: 620px;
            line-height: 1.65;
            color: #ccc;
            margin-bottom: 3rem;
        }

        .btn {
            padding: 15px 42px;
            background: transparent;
            color: var(--gold);
            border: 2px solid var(--gold);
            font-size: 1.1rem;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.4s ease;
        }

        .btn:hover {
            background: var(--gold);
            color: #000;
            transform: scale(1.08);
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.7);
        }
    </style>
</head>
<body>

    <div id="background"></div>
    <canvas id="canvas"></canvas>
    <div class="fog" id="fog"></div>

    <div class="content">
        <div class="kingdom-logo">KINGDOMSX</div>
        <div class="error-code">404</div>
        <div class="subtitle">THE REALM WAS LOST</div>
        <p class="message">
            The kingdom you seek has fallen into the mists of time.<br>
            Its Nexus has been destroyed, and its banners no longer fly.
        </p>
        <a href="https://kingdomsx.com/" class="btn">Return to the Main Lands</a>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const fog = document.getElementById('fog');

        let particles = [];
        let mouse = { x: 0, y: 0 };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1.5;     // Smaller circles as requested
                this.baseSize = this.size;
                this.speedY = Math.random() * 0.7 + 0.3;
            }

            update() {
                this.y += this.speedY;

                // Gentle attraction to mouse when close
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < 160 && distance > 0) {
                    const force = (160 - distance) / 160;
                    this.x += dx * force * 0.018;
                    this.y += dy * force * 0.018;
                }

                if (this.y > canvas.height) {
                    this.y = -10;
                    this.x = Math.random() * canvas.width;
                }
            }

            draw() {
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                let drawSize = this.size;
                let alpha = 0.85;

                // New effect: Nearby particles glow brighter and grow slightly
                if (distance < 160) {
                    const intensity = (160 - distance) / 160;
                    drawSize = this.baseSize * (1 + intensity * 1.8);
                    alpha = 0.9 + intensity * 0.6;
                }

                ctx.shadowBlur = distance < 160 ? 22 : 10;
                ctx.shadowColor = '#d4af37';
                
                ctx.fillStyle = `rgba(212, 175, 55, ${alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, drawSize, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function createParticles(count) {
            particles = [];
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let particle of particles) {
                particle.update();
                particle.draw();
            }

            requestAnimationFrame(animate);
        }

        // Mouse movement
        document.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;

            const xPercent = (e.clientX / window.innerWidth) * 100;
            const yPercent = (e.clientY / window.innerHeight) * 100;
            fog.style.setProperty('--mouse-x', `${xPercent}%`);
            fog.style.setProperty('--mouse-y', `${yPercent}%`);
        });

        // Initialize
        createParticles(80);   // Slightly more particles since they're smaller
        animate();

        // Keyboard shortcut
        document.addEventListener('keydown', () => {
            window.location.href = 'https://kingdomsx.com/';
        });
    </script>
</body>
</html>
